<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Paleontología</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="estilo.css"/>
        <link href="https://fonts.googleapis.com/css2?family=Caveat&display=swap" rel="stylesheet">
    </head>
    <body>
        <header id="head">
            <div class="cab-titulo">Huellas del Mesozoico</div>
            <div class="cab-sub">Atlas paleontológico interactivo</div>
            <div class="frase-cierre">Mové el tiempo.<br>Mirá como cambia la vida</div>
        </header>
        <div id="panelcapa">
            <div class="capas-tit">Capas</div>
            <label class="fila-capa">
                <span><i class="punto" style="background:#4f9dd9"></i>Fauna</span>
                <input type="checkbox" id="chkFauna" checked>
                <span class="switch"></span>
            </label>
            <label class="fila-capa">
                <span><i class="punto" style="background:#5cb85c"></i>Flora</span>
                <input type="checkbox" id="chkFlora" checked>
                <span class="switch"></span>
            </label>
            <label class="fila-capa">
                <span><i class="punto" style="background:#e8613c"></i>Dinosaurios saurisquios</span>
                <input type="checkbox" id="chkSaur" checked>
                <span class="switch"></span>
            </label>
            <label class="fila-capa">
                <span><i class="punto" style="background:#f2c94c"></i>Dinosaurios ornitisquios</span>
                <input type="checkbox" id="chkOrni" checked>
                <span class="switch"></span>
            </label>
            <div class="capas-tit" style="margin-top: 12px;">Filtros</div>
            <label class="eti-filtro" for="selProv">Provincia</label>
            <select id="selProv">
                <option value="Todas">Todas</option>
            </select>
            <label class="etiqueta-filtro" for="buscador" style="margin-top:10px;">Especie</label>
            <input type="search" id="buscador" placeholder="Buscar especie...">
            <div id="resultadosBusqueda"></div>
        </div>
        <div id="panelDet">
            <button id="cerrarDet" aria-label="Cerrar">X</button>
            <div id="detNom"></div>
            <div id="detTipo"></div>
            <div id="det-fila">
                <span class="det-etiqueta">Periodo</span>
                <span id="detPeriodo"></span>
            </div>
            <div class="det-fila">
                <span class="det-etiqueta">Ubicación del hallazgo</span>
                <span id="detUbicacion"></span>
            </div>
            <div class="det-fila">
                <span class="det-etiqueta">Familia</span>
                <span id="detFam"></span>
            </div>
            <div class="det-fila">
                <span class="det-etiqueta">Fuente</span>
                <span>Paleobiology Database</span>
            </div>
        </div>
        <div id="panel">
            <div class="panel-cab">
                <span class="panel-titulo">Línea de tiempo geológica</span>
                <span class="panel-etapa" id="etapaNombre">—</span>
                <span class="panel-cont">Mostrando <span id="contador">0 registros</span></span>
            </div>
            <input type="range" id="slider" min="0" max="28" value="0">
            <div class="eras">
                <span style="left:10%">Triásico<br><small>252–201 Ma</small></span>
                <span style="left:40%">Jurásico<br><small>201–145 Ma</small></span>
                <span style="left:79%">Cretácico<br><small>145–66 Ma</small></span>
            </div>
        </div>

        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="datos_paleo (4).js"></script>
        <script src="app.js"></script>

    </body>
</html>
