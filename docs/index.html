<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Paleontología</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <style>
            html, body {margin:0; padding:0; height: 100%;}
            #map {width:100%; height: 100%;}
        </style>
    </head>
    <body>

        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="datos_paleo.js"></script>
        <script>
            //empieza el mapa
            const map= L.map('map').setView([-38,-66],4);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            console.log('cargando ${FOSILES.lenght} registros...');
            FOSILES.forEach(fosil => {
                const color = fosil.esDino ? "#d9534f" : (fosil.tipo === "Flora" ? "#5cb85c" : "#4f9dd9");

                L.circleMarker([fosil.lat, fosil.lng], {
                    radius: fosil.esDino ? 7:4,
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.7,
                    weight: fosil.esDino ? 1.5:0.5
                })
                .bindPopup(`
                <b>${fosil.nombre||"Sin identificar"}</b><br>
                ${fosil.esDino ? "Dinosaurio<br>":""}
                Tipo: ${fosil.tipo}<br>
                Familia: ${fosil.familia || "-"}<br>
                Formación: ${fosil.formacion || "-"}<br>
                Provincia: ${fosil.provincia || "-"}<br>
                Edad: ${fosil.edadMa ?? "-"} Ma
                `)
                .addTo(map);
            });
            
        </script>

    </body>
</html>
